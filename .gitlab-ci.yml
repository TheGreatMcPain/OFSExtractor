stages:
  - build
  - test
  - deploy
  - release
# Gitlab CI YAML based on
# https://about.gitlab.com/blog/secure-rust-development-with-gitlab/
#
# Cache configuration to speed up builds by reusing dependencies
#
cache:
  key: $CI_COMMIT_REF_SLUG # Use branch name as cache key
  paths:
    - .cargo/ # Cache Cargo registry and git dependencies
    - target/ # Cache compiled artifacts
#
# Base template for Rust jobs - shared configuration
#
.rust-template:
  image: rust:slim # Use slim Rust image for faster downloads
  before_script:
    - apt-get update && apt install -y g++-mingw-w64-x86-64 g++-mingw-w64-i686
#
# Template for cross-compilation build jobs
#
.build-template:
  extends: .rust-template
  stage: build
  script:
    - rustup target add $TARGET
    - cargo build --release --target $TARGET
#
# Build for Linux x86_64 (primary target platform)
#
build-linux:
  extends: .build-template
  variables:
    TARGET: x86_64-unknown-linux-gnu
  artifacts:
    paths:
      - target/$TARGET/release/OFSExtractor
    expire_in: 1 week
  allow_failure: false
#
# Build for Windows x86_64 (cross-compilation)
#
build-windows-64bit:
  extends: .build-template
  variables:
    TARGET: x86_64-pc-windows-gnu
  artifacts:
    paths:
      - target/$TARGET/release/OFSExtractor.exe
    expire_in: 1 week
  allow_failure: true
#
# Build for Windows x86_64 (cross-compilation)
#
build-windows-32bit:
  extends: .build-template
  variables:
    TARGET: i686-pc-windows-gnu
  artifacts:
    paths:
      - target/$TARGET/release/OFSExtractor.exe
    expire_in: 1 week
  allow_failure: true
#
# Run unit tests
#
test:unit:
  extends: .rust-template
  stage: test
  script:
    - cargo test --verbose
#
# Run linter
#
test:clippy:
  extends: .rust-template
  stage: test
  script:
    - rustup component add clippy
    - cargo clippy -- -D warnings
  allow_failure: true
#
# Check for formatting
#
test:format:
  extends: .rust-template
  stage: test
  script:
    - rustup component add rustfmt
    - cargo fmt -- --check
  allow_failure: true
#
# Template for package
#
.deploy-package-zip:
  image: alpine/curl:latest
  stage: deploy
  before_script:
    - apk add zip
#
# Package for Windows 64bit
#
package:windows-64bit:
  extends: .deploy-package-zip
  variables:
    PACKAGE_NAME: OFSExtractor-$CI_COMMIT_REF_NAME-64bit.zip
    TARGET: x86_64-pc-windows-gnu
  script:
    - apk add zip
    - zip -9 --junk-paths $PACKAGE_NAME target/$TARGET/release/OFSExtractor.exe
    - |
      curl -v --location --header "JOB-TOKEN: $CI_JOB_TOKEN" \
      --upload-file $PACKAGE_NAME \
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$TARGET/$CI_COMMIT_BRANCH/$PACKAGE_NAME"
  artifacts:
    paths:
      - target/$TARGET/release/OFSExtractor.exe
      - $PACKAGE_NAME
    expire_in: 1 week
  needs:
    - build-windows-64bit
#
# Package for Windows 32bit
#
package:windows-32bit:
  extends: .deploy-package-zip
  variables:
    PACKAGE_NAME: OFSExtractor-$CI_COMMIT_REF_NAME-32bit.zip
    TARGET: i686-pc-windows-gnu
  script:
    - apk add zip
    - zip -9 --junk-paths $PACKAGE_NAME target/$TARGET/release/OFSExtractor.exe
    - |
      curl -v --location --header "JOB-TOKEN: $CI_JOB_TOKEN" \
      --upload-file $PACKAGE_NAME \
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$TARGET/$CI_COMMIT_BRANCH/$PACKAGE_NAME"
  artifacts:
    paths:
      - target/$TARGET/release/OFSExtractor.exe
      - $PACKAGE_NAME
    expire_in: 1 week
  needs:
    - build-windows-32bit
#
# Release
#
release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Running release_job"
  release:
    tag_name: $CI_COMMIT_TAG
    description: $CI_COMMIT_TAG
